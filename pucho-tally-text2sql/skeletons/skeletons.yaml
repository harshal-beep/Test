- id: top_customers_by_sales
  question_bank_id: Q006
  persona: Owner / Seth
  intent: top_customers
  join_depth: 3
  tables:
  - mst_ledger
  - trn_accounting
  - trn_voucher
  slots: {}
  sql: "SELECT ml.name AS customer,\n  -SUM(ta.amount) AS total_sales\nFROM mst_ledger ml\nJOIN trn_accounting ta ON ta._ledger\
    \ = ml.guid\nJOIN trn_voucher tv ON ta.guid = tv.guid\nWHERE ml.parent IN ('Sundry Debtors')\n  AND tv.is_invoice = 1\n\
    \  AND ta.amount < 0\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date\
    \ FROM config WHERE name = 'Period To')\nGROUP BY ml.name\nORDER BY total_sales DESC\nLIMIT 10;"
  nl_en: Who are my top 10 customers by sales this period?
- id: top_customers_by_invoices
