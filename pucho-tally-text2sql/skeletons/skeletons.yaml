- id: expense_ratio_by_group
  question_bank_id: Q072
  persona: Owner / Seth
  intent: expense_ratio
  join_depth: 3
  tables:
  - trn_accounting
  - trn_voucher
  - mst_ledger
  - mst_group
  slots: {}
  sql: "SELECT mg.name AS expense_group,\n  SUM(ta.amount) AS expense_amount,\n  -SUM(CASE WHEN mg2.name = 'Sales Accounts'\
    \ THEN ta2.amount ELSE 0 END) AS total_sales,\n  ROUND(SUM(ta.amount) /\n    NULLIF(-SUM(CASE WHEN mg2.name = 'Sales Accounts'\
    \ THEN ta2.amount ELSE 0 END), 0) * 100, 2\n  ) AS expense_ratio_pct\nFROM trn_accounting ta\nJOIN trn_voucher tv ON ta.guid\
    \ = tv.guid\nJOIN mst_ledger ml ON ta._ledger = ml.guid\nJOIN mst_group mg ON ml._parent = mg.guid\nCROSS JOIN (\n  SELECT\
    \ -SUM(ta2.amount) AS sales\n  FROM trn_accounting ta2\n  JOIN trn_voucher tv2 ON ta2.guid = tv2.guid\n  JOIN mst_ledger\
    \ ml2 ON ta2._ledger = ml2.guid\n  JOIN mst_group mg2 ON ml2._parent = mg2.guid\n  WHERE mg2.name = 'Sales Accounts'\n\
    \    AND tv2.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config\
    \ WHERE name = 'Period To')\n) s\nWHERE mg.name IN ('Direct Expenses','Indirect Expenses')\n  AND tv.date BETWEEN (SELECT\
    \ value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\n\
    GROUP BY mg.name, s.sales;"
  nl_en: Show expense ratio by expense group.
