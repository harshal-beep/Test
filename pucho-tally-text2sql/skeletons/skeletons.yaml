    \ FROM config WHERE name = 'Period To')\nGROUP BY msi.name, msi.tax_rate\nORDER BY msi.tax_rate, sales_value DESC;"
  nl_en: List items sold this period with their GST rates.
- id: b2b_vs_b2c
  question_bank_id: Q015
  persona: Accountant / Munim
  intent: b2b_vs_b2c
  join_depth: 3
  tables:
  - mst_ledger
  - trn_voucher
  - trn_accounting
  slots: {}
  sql: "SELECT\n  CASE WHEN ml.gstn IS NOT NULL AND ml.gstn <> '' THEN 'B2B' ELSE 'B2C' END AS sale_type,\n  COUNT(DISTINCT\
    \ tv.guid) AS invoices,\n  -SUM(ta.amount) AS total_value\nFROM trn_voucher tv\nJOIN trn_accounting ta ON ta.guid = tv.guid\n\
    JOIN mst_ledger ml ON ta._ledger = ml.guid\nWHERE tv.is_invoice = 1\n  AND ta.ledger = tv.party_name\n  AND ta.amount\
    \ < 0\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM\
    \ config WHERE name = 'Period To')\nGROUP BY sale_type;"
  nl_en: What is the split between B2B and B2C sales this period?
