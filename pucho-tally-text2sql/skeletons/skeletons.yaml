  - mst_group
  slots: {}
  sql: "SELECT EXTRACT(YEAR FROM tv.date) AS year,\n  EXTRACT(MONTH FROM tv.date) AS month,\n  -SUM(ta.amount) AS monthly_sales\n\
    FROM trn_accounting ta\nJOIN trn_voucher tv ON ta.guid = tv.guid\nJOIN mst_ledger ml ON ta._ledger = ml.guid\nJOIN mst_group\
    \ mg ON ml._parent = mg.guid\nWHERE mg.name = 'Sales Accounts'\n  AND tv.is_order_voucher = 0\nGROUP BY EXTRACT(YEAR FROM\
    \ tv.date), EXTRACT(MONTH FROM tv.date)\nORDER BY year, month;"
  nl_en: Show monthly sales figures.
- id: sales_by_month_item
  question_bank_id: Q031
  persona: Sales / Marketing
  intent: sales_by_month
  join_depth: 3
  tables:
  - trn_inventory
  - mst_stock_item
  - trn_voucher
  slots: {}
  sql: "SELECT EXTRACT(MONTH FROM tv.date) AS month,\n  msi.name AS item,\n  SUM(ABS(ti.quantity)) AS qty_sold,\n  -SUM(ti.amount)\
    \ AS sales_value\nFROM trn_inventory ti\nJOIN mst_stock_item msi ON ti._item = msi.guid\nJOIN trn_voucher tv ON ti.guid\
    \ = tv.guid\nWHERE tv.is_invoice = 1 AND ti.quantity < 0\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE\
    \ name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY EXTRACT(MONTH FROM tv.date),\
    \ msi.name\nORDER BY month, sales_value DESC;"
  nl_en: Show item-wise sales by month this period.
- id: dormant_customers
  question_bank_id: Q032
  persona: Sales / Marketing
  intent: dormant_customers
  join_depth: 2
  tables:
  - mst_ledger
  - trn_voucher
  slots: {}
  sql: "SELECT ml.name AS customer,\n  MAX(tv.date) AS last_purchase_date,\n  CURRENT_DATE - MAX(tv.date) AS days_inactive\n\
    FROM mst_ledger ml\nLEFT JOIN trn_voucher tv ON tv.party_name = ml.name AND tv.is_invoice = 1\nWHERE ml.parent = 'Sundry\
    \ Debtors'\nGROUP BY ml.name\nHAVING MAX(tv.date) < CURRENT_DATE - INTERVAL '90 days'\n   OR MAX(tv.date) IS NULL\nORDER\
    \ BY days_inactive DESC NULLS FIRST;"
  nl_en: Which customers have not bought in the last 90 days?
- id: avg_order_value
  question_bank_id: Q033
  persona: Sales / Marketing
  intent: avg_order_value
  join_depth: 2
  tables:
  - trn_voucher
  - trn_accounting
  slots: {}
  sql: "SELECT ROUND(AVG(invoice_total)::numeric, 2) AS avg_order_value,\n  MIN(invoice_total) AS min_order, MAX(invoice_total)\
    \ AS max_order,\n  COUNT(*) AS total_invoices\nFROM (\n  SELECT tv.guid, -SUM(ta.amount) AS invoice_total\n  FROM trn_voucher\
    \ tv\n  JOIN trn_accounting ta ON ta.guid = tv.guid\n  WHERE tv.is_invoice = 1\n    AND ta.ledger = tv.party_name AND\
    \ ta.amount < 0\n    AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date\
    \ FROM config WHERE name = 'Period To')\n  GROUP BY tv.guid\n) t;"
  nl_en: What is the average order value this period?
- id: avg_order_value_by_customer
  question_bank_id: Q033
  persona: Sales / Marketing
  intent: avg_order_value
  join_depth: 2
  tables:
  - trn_voucher
  - trn_accounting
  slots: {}
  sql: "SELECT tv.party_name,\n  COUNT(DISTINCT tv.guid) AS invoices,\n  ROUND(AVG(ABS(ta.amount))::numeric, 2) AS avg_invoice_value\n\
    FROM trn_voucher tv\nJOIN trn_accounting ta ON ta.guid = tv.guid\nWHERE tv.is_invoice = 1\n  AND ta.ledger = tv.party_name\
    \ AND ta.amount < 0\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date\
    \ FROM config WHERE name = 'Period To')\nGROUP BY tv.party_name\nORDER BY avg_invoice_value DESC;"
  nl_en: Show average order value per customer.
- id: sales_by_state
  question_bank_id: Q034
  persona: Sales / Marketing
  intent: sales_by_state
  join_depth: 3
  tables:
  - mst_ledger
  - trn_accounting
  - trn_voucher
  slots: {}
  sql: "SELECT COALESCE(ml.place_of_supply, 'Unknown') AS state,\n  COUNT(DISTINCT tv.guid) AS invoices,\n  -SUM(ta.amount)\
    \ AS total_sales\nFROM trn_voucher tv\nJOIN trn_accounting ta ON ta.guid = tv.guid\nJOIN mst_ledger ml ON ta._ledger =\
    \ ml.guid\nWHERE tv.is_invoice = 1\n  AND ta.ledger = tv.party_name AND ta.amount < 0\n  AND tv.date BETWEEN (SELECT value::date\
    \ FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY ml.place_of_supply\n\
    ORDER BY total_sales DESC;"
  nl_en: Show sales broken down by customer state.
- id: discount_given_total
  question_bank_id: Q035
  persona: Sales / Marketing
  intent: discount_given
  join_depth: 2
  tables:
  - trn_inventory
  - trn_voucher
  slots: {}
  sql: "SELECT SUM(ti.discount) AS total_discount_given,\n  -SUM(ti.amount) AS gross_sales,\n  ROUND(SUM(ti.discount) / NULLIF(-SUM(ti.amount),\
    \ 0) * 100, 2) AS discount_pct\nFROM trn_inventory ti\nJOIN trn_voucher tv ON ti.guid = tv.guid\nWHERE tv.is_invoice =\
    \ 1 AND ti.quantity < 0\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT\
    \ value::date FROM config WHERE name = 'Period To');"
  nl_en: How much discount was given on sales this period?
- id: discount_given_by_item
  question_bank_id: Q035
  persona: Sales / Marketing
  intent: discount_given
  join_depth: 3
  tables:
  - trn_inventory
  - mst_stock_item
  - trn_voucher
  slots: {}
  sql: "SELECT msi.name AS item,\n  SUM(ti.discount) AS total_discount,\n  -SUM(ti.amount) AS sales_value\nFROM trn_inventory\
    \ ti\nJOIN mst_stock_item msi ON ti._item = msi.guid\nJOIN trn_voucher tv ON ti.guid = tv.guid\nWHERE tv.is_invoice =\
    \ 1 AND ti.quantity < 0\n  AND ti.discount > 0\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period\
    \ From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY msi.name\nORDER BY total_discount DESC;"
  nl_en: Show discount given by item.
- id: repeat_customers
  question_bank_id: Q036
  persona: Sales / Marketing
  intent: repeat_customers
  join_depth: 2
  tables:
  - mst_ledger
  - trn_voucher
  slots: {}
  sql: "SELECT tv.party_name AS customer,\n  COUNT(DISTINCT tv.guid) AS purchase_count\nFROM trn_voucher tv\nWHERE tv.is_invoice\
    \ = 1\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM\
    \ config WHERE name = 'Period To')\nGROUP BY tv.party_name\nHAVING COUNT(DISTINCT tv.guid) > 1\nORDER BY purchase_count\
    \ DESC;"
  nl_en: Which customers bought from me more than once this period?
- id: stock_on_hand_list
  question_bank_id: Q037
  persona: Store / Inventory
  intent: stock_on_hand
  join_depth: 1
  tables:
  - mst_stock_item
  slots: {}
  sql: "SELECT msi.name AS item, msi.closing_balance AS qty_on_hand,\n  msi.uom AS unit\nFROM mst_stock_item msi\nWHERE msi.closing_balance\
    \ > 0\nORDER BY msi.closing_balance DESC;"
  nl_en: What stock do I have on hand?
- id: stock_on_hand_low
  question_bank_id: Q037
  persona: Store / Inventory
  intent: stock_on_hand
  join_depth: 1
  tables:
  - mst_stock_item
  slots: {}
  sql: "SELECT msi.name, msi.closing_balance AS qty, msi.uom\nFROM mst_stock_item msi\nWHERE msi.closing_balance <= msi.reorder_level\n\
    \  AND msi.closing_balance >= 0\nORDER BY msi.closing_balance ASC;"
  nl_en: Which items have stock at or below reorder level?
- id: total_stock_value
  question_bank_id: Q038
  persona: Store / Inventory
  intent: total_stock_value
  join_depth: 1
  tables:
  - mst_stock_item
  slots: {}
  sql: 'SELECT -SUM(msi.closing_value) AS total_stock_value

    FROM mst_stock_item msi;'
  nl_en: What is the total stock value?
- id: total_stock_value_by_group
  question_bank_id: Q038
  persona: Store / Inventory
  intent: total_stock_value
  join_depth: 2
  tables:
  - mst_stock_item
  - mst_stock_group
  slots: {}
  sql: "SELECT msg.name AS stock_group,\n  COUNT(msi.guid) AS item_count,\n  SUM(msi.closing_balance) AS total_qty,\n  -SUM(msi.closing_value)\
    \ AS total_value\nFROM mst_stock_item msi\nJOIN mst_stock_group msg ON msi._stock_group = msg.guid\nGROUP BY msg.name\n\
    ORDER BY total_value DESC;"
  nl_en: Show total stock value by stock group.
- id: stock_by_godown_summary
  question_bank_id: Q039
  persona: Store / Inventory
  intent: stock_by_godown
  join_depth: 3
  tables:
  - trn_inventory
  - mst_godown
  - mst_stock_item
  slots: {}
  sql: "SELECT mgd.name AS godown,\n  COUNT(DISTINCT ti._item) AS item_count,\n  SUM(ABS(CASE WHEN ti.quantity > 0 THEN ti.quantity\
    \ ELSE 0 END)) AS total_stock_in,\n  SUM(ABS(CASE WHEN ti.quantity < 0 THEN ti.quantity ELSE 0 END)) AS total_stock_out\n\
    FROM trn_inventory ti\nJOIN mst_godown mgd ON ti._godown = mgd.guid\nGROUP BY mgd.name\nORDER BY total_stock_in DESC;"
  nl_en: Show stock movement summary by godown.
- id: stock_by_godown_item
  question_bank_id: Q039
  persona: Store / Inventory
  intent: stock_by_godown
  join_depth: 3
  tables:
  - trn_inventory
  - mst_godown
  - mst_stock_item
  slots: {}
  sql: "SELECT mgd.name AS godown, msi.name AS item,\n  SUM(ti.quantity) AS net_qty\nFROM trn_inventory ti\nJOIN mst_godown\
    \ mgd ON ti._godown = mgd.guid\nJOIN mst_stock_item msi ON ti._item = msi.guid\nGROUP BY mgd.name, msi.name\nHAVING SUM(ti.quantity)\
    \ <> 0\nORDER BY mgd.name, net_qty DESC;"
  nl_en: Show item-wise stock by godown.
- id: stock_by_group
  question_bank_id: Q040
  persona: Store / Inventory
  intent: stock_by_group
  join_depth: 2
  tables:
  - mst_stock_item
  - mst_stock_group
  slots: {}
  sql: "SELECT msg.name AS stock_group,\n  COUNT(msi.guid) AS items,\n  SUM(msi.closing_balance) AS total_qty,\n  -SUM(msi.closing_value)\
    \ AS total_value\nFROM mst_stock_item msi\nJOIN mst_stock_group msg ON msi._stock_group = msg.guid\nGROUP BY msg.name\n\
    ORDER BY total_value DESC;"
  nl_en: Show stock quantity and value by stock group.
- id: stock_by_category
  question_bank_id: Q041
  persona: Store / Inventory
  intent: stock_by_category
  join_depth: 2
  tables:
  - mst_stock_item
  - mst_stock_category
  slots: {}
  sql: "SELECT msc.name AS category,\n  COUNT(msi.guid) AS items,\n  SUM(msi.closing_balance) AS total_qty,\n  -SUM(msi.closing_value)\
    \ AS total_value\nFROM mst_stock_item msi\nJOIN mst_stock_category msc ON msi._category = msc.guid\nGROUP BY msc.name\n\
    ORDER BY total_value DESC;"
  nl_en: Show stock grouped by category.
- id: slow_moving_items
  question_bank_id: Q042
  persona: Store / Inventory
  intent: slow_moving
  join_depth: 3
  tables:
  - trn_inventory
  - mst_stock_item
  - trn_voucher
  slots: {}
  sql: "SELECT msi.name AS item,\n  COALESCE(SUM(CASE WHEN ti.quantity < 0 THEN ABS(ti.quantity) ELSE 0 END), 0) AS qty_sold,\n\
    \  msi.closing_balance AS stock_on_hand\nFROM mst_stock_item msi\nLEFT JOIN trn_inventory ti ON ti._item = msi.guid\n\
    LEFT JOIN trn_voucher tv ON ti.guid = tv.guid\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period\
    \ From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY msi.name, msi.closing_balance\nHAVING\
    \ SUM(CASE WHEN ti.quantity < 0 THEN ABS(ti.quantity) ELSE 0 END) < 10\n   OR SUM(CASE WHEN ti.quantity < 0 THEN ABS(ti.quantity)\
    \ ELSE 0 END) IS NULL\nORDER BY qty_sold NULLS FIRST;"
  nl_en: Which items are slow-moving (low sales quantity) this period?
- id: fast_moving_items
  question_bank_id: Q043
  persona: Store / Inventory
  intent: fast_moving
  join_depth: 3
  tables:
  - trn_inventory
  - mst_stock_item
  - trn_voucher
  slots: {}
  sql: "SELECT msi.name AS item,\n  SUM(ABS(ti.quantity)) AS qty_sold,\n  -SUM(ti.amount) AS sales_value,\n  msi.closing_balance\
    \ AS current_stock\nFROM trn_inventory ti\nJOIN mst_stock_item msi ON ti._item = msi.guid\nJOIN trn_voucher tv ON ti.guid\
    \ = tv.guid\nWHERE tv.is_invoice = 1 AND ti.quantity < 0\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE\
    \ name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY msi.name, msi.closing_balance\n\
    ORDER BY qty_sold DESC\nLIMIT 20;"
  nl_en: Which are the fastest-moving items this period?
- id: negative_stock
  question_bank_id: Q044
  persona: Store / Inventory
  intent: negative_stock
  join_depth: 1
  tables:
  - mst_stock_item
  slots: {}
  sql: 'SELECT msi.name AS item, msi.closing_balance AS qty, msi.uom

    FROM mst_stock_item msi

    WHERE msi.closing_balance < 0

    ORDER BY msi.closing_balance;'
  nl_en: Which items have negative stock?
- id: reorder_items
  question_bank_id: Q045
  persona: Store / Inventory
  intent: reorder
  join_depth: 1
  tables:
  - mst_stock_item
  slots: {}
  sql: "SELECT msi.name AS item, msi.closing_balance AS qty_on_hand,\n  msi.reorder_level, msi.uom,\n  msi.reorder_level -\
    \ msi.closing_balance AS qty_to_order\nFROM mst_stock_item msi\nWHERE msi.closing_balance <= msi.reorder_level\n  AND\
    \ msi.reorder_level > 0\nORDER BY qty_to_order DESC;"
  nl_en: Which items need to be reordered?
- id: reorder_by_supplier
  question_bank_id: Q045
  persona: Store / Inventory
  intent: reorder
  join_depth: 3
  tables:
  - mst_stock_item
  - mst_stock_group
  slots: {}
  sql: "SELECT msg.name AS stock_group,\n  COUNT(msi.guid) AS items_below_reorder,\n  SUM(msi.reorder_level - msi.closing_balance)\
    \ AS total_qty_to_order\nFROM mst_stock_item msi\nJOIN mst_stock_group msg ON msi._stock_group = msg.guid\nWHERE msi.closing_balance\
    \ <= msi.reorder_level\n  AND msi.reorder_level > 0\nGROUP BY msg.name;"
  nl_en: How many items need reordering per stock group?
- id: batch_expiry_upcoming
  question_bank_id: Q046
  persona: Store / Inventory
  intent: batch_expiry
  join_depth: 2
  tables:
  - trn_batch
  - mst_stock_item
  slots: {}
  sql: "SELECT msi.name AS item, tb.batch_name,\n  tb.expiry_date, tb.closing_balance AS qty,\n  tb.expiry_date - CURRENT_DATE\
    \ AS days_to_expiry\nFROM trn_batch tb\nJOIN mst_stock_item msi ON tb._item = msi.guid\nWHERE tb.expiry_date IS NOT NULL\n\
    \  AND tb.expiry_date > CURRENT_DATE\n  AND tb.expiry_date <= CURRENT_DATE + INTERVAL '90 days'\n  AND tb.closing_balance\
    \ > 0\nORDER BY tb.expiry_date;"
  nl_en: Which batches are expiring in the next 90 days?
- id: batch_expiry_all
  question_bank_id: Q046
  persona: Store / Inventory
  intent: batch_expiry
  join_depth: 2
  tables:
  - trn_batch
  - mst_stock_item
  slots: {}
  sql: "SELECT msi.name AS item, tb.batch_name,\n  tb.expiry_date, tb.closing_balance AS qty_remaining\nFROM trn_batch tb\n\
    JOIN mst_stock_item msi ON tb._item = msi.guid\nWHERE tb.expiry_date IS NOT NULL AND tb.closing_balance > 0\nORDER BY\
    \ tb.expiry_date NULLS LAST;"
  nl_en: Show all batch expiry dates for items in stock.
- id: item_movement_period
  question_bank_id: Q047
  persona: Store / Inventory
  intent: item_movement
  join_depth: 3
  tables:
  - trn_inventory
  - trn_voucher
  - mst_stock_item
  slots: {}
  sql: "SELECT msi.name AS item,\n  SUM(CASE WHEN ti.quantity > 0 THEN ti.quantity ELSE 0 END) AS qty_in,\n  SUM(CASE WHEN\
    \ ti.quantity < 0 THEN ABS(ti.quantity) ELSE 0 END) AS qty_out,\n  SUM(ti.quantity) AS net_movement\nFROM trn_inventory\
    \ ti\nJOIN mst_stock_item msi ON ti._item = msi.guid\nJOIN trn_voucher tv ON ti.guid = tv.guid\nWHERE tv.date BETWEEN\
    \ (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period\
    \ To')\nGROUP BY msi.name\nORDER BY qty_out DESC;"
  nl_en: Show item stock movement (in/out) for this period.
- id: item_movement_single
  question_bank_id: Q047
  persona: Store / Inventory
  intent: item_movement
  join_depth: 3
  tables:
  - trn_inventory
  - trn_voucher
  - mst_vouchertype
  - mst_stock_item
  slots:
    item:
      type: item_name
      source: mst_stock_item.name
  sql: "SELECT tv.date, mvt.name AS voucher_type,\n  tv.voucher_number, tv.party_name,\n  ti.quantity, ti.rate, ti.amount\n\
    FROM trn_inventory ti\nJOIN mst_stock_item msi ON ti._item = msi.guid\nJOIN trn_voucher tv ON ti.guid = tv.guid\nJOIN\
    \ mst_vouchertype mvt ON tv._voucher_type = mvt.guid\nWHERE msi.name ILIKE '%{item}%'\n  AND tv.date BETWEEN (SELECT value::date\
    \ FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nORDER BY tv.date;"
  nl_en: Show all movements for item {item} this period.
- id: item_movement_by_type
  question_bank_id: Q047
  persona: Store / Inventory
  intent: item_movement
  join_depth: 3
  tables:
  - trn_inventory
  - trn_voucher
  - mst_vouchertype
  slots: {}
  sql: "SELECT mvt.name AS voucher_type,\n  SUM(CASE WHEN ti.quantity > 0 THEN ti.quantity ELSE 0 END) AS qty_in,\n  SUM(CASE\
    \ WHEN ti.quantity < 0 THEN ABS(ti.quantity) ELSE 0 END) AS qty_out\nFROM trn_inventory ti\nJOIN trn_voucher tv ON ti.guid\
    \ = tv.guid\nJOIN mst_vouchertype mvt ON tv._voucher_type = mvt.guid\nWHERE tv.date BETWEEN (SELECT value::date FROM config\
    \ WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY mvt.name\nORDER\
    \ BY qty_out DESC;"
  nl_en: Show stock movement by voucher type (sales vs purchase vs transfer).
- id: uom_check
  question_bank_id: Q048
  persona: Store / Inventory
  intent: uom_check
  join_depth: 2
  tables:
  - mst_stock_item
  - mst_uom
  slots: {}
  sql: "SELECT msi.name AS item, mu.name AS base_uom,\n  msi.closing_balance AS qty, msi.uom AS uom_name\nFROM mst_stock_item\
    \ msi\nJOIN mst_uom mu ON msi._uom = mu.guid\nORDER BY msi.name;"
  nl_en: List all items with their units of measure.
- id: purchase_price_trend
  question_bank_id: Q049
  persona: Store / Inventory
  intent: purchase_price_trend
  join_depth: 3
  tables:
  - trn_inventory
  - trn_voucher
  - mst_stock_item
  slots: {}
  sql: "SELECT msi.name AS item,\n  EXTRACT(YEAR FROM tv.date) AS year,\n  EXTRACT(MONTH FROM tv.date) AS month,\n  AVG(ti.rate)\
    \ AS avg_purchase_rate,\n  MAX(ti.rate) AS max_rate,\n  MIN(ti.rate) AS min_rate\nFROM trn_inventory ti\nJOIN mst_stock_item\
    \ msi ON ti._item = msi.guid\nJOIN trn_voucher tv ON ti.guid = tv.guid\nWHERE tv.is_invoice = 1 AND ti.quantity > 0\n\
    GROUP BY msi.name, EXTRACT(YEAR FROM tv.date), EXTRACT(MONTH FROM tv.date)\nORDER BY msi.name, year, month;"
  nl_en: Show purchase price trend for each item by month.
- id: purchase_price_trend_item
  question_bank_id: Q049
  persona: Store / Inventory
  intent: purchase_price_trend
  join_depth: 3
  tables:
  - trn_inventory
  - trn_voucher
  - mst_stock_item
  slots:
    item:
      type: item_name
      source: mst_stock_item.name
  sql: "SELECT tv.date, tv.party_name AS supplier,\n  ti.quantity, ti.rate, ti.amount\nFROM trn_inventory ti\nJOIN mst_stock_item\
    \ msi ON ti._item = msi.guid\nJOIN trn_voucher tv ON ti.guid = tv.guid\nWHERE msi.name ILIKE '%{item}%'\n  AND tv.is_invoice\
    \ = 1 AND ti.quantity > 0\nORDER BY tv.date;"
  nl_en: Show purchase price history for item {item}.
- id: godown_transfer_list
  question_bank_id: Q050
  persona: Store / Inventory
  intent: godown_transfer
  join_depth: 3
  tables:
  - trn_inventory
  - mst_godown
  - trn_voucher
  slots: {}
  sql: "SELECT tv.date, tv.voucher_number,\n  mg_from.name AS from_godown,\n  mg_to.name AS to_godown,\n  ti.quantity, ti.amount\n\
    FROM trn_inventory ti\nJOIN mst_godown mg_from ON ti._godown = mg_from.guid\nJOIN trn_voucher tv ON ti.guid = tv.guid\n\
    JOIN mst_vouchertype mvt ON tv._voucher_type = mvt.guid\nWHERE mvt.name ILIKE '%Transfer%'\n  AND tv.date BETWEEN (SELECT\
    \ value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\n\
    ORDER BY tv.date DESC;"
  nl_en: Show godown transfer entries this period.
- id: salary_total_period
  question_bank_id: Q051
  persona: HR / Admin
  intent: salary_total
  join_depth: 2
  tables:
  - trn_payhead
  - trn_voucher
  slots: {}
  sql: "SELECT -SUM(tp.amount) AS total_salary_paid\nFROM trn_payhead tp\nJOIN trn_voucher tv ON tp.guid = tv.guid\nWHERE\
    \ tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE\
    \ name = 'Period To')\n  AND tp.amount < 0;"
  nl_en: What is the total salary paid this period?
- id: salary_total_by_month
  question_bank_id: Q051
  persona: HR / Admin
  intent: salary_total
  join_depth: 2
  tables:
  - trn_payhead
