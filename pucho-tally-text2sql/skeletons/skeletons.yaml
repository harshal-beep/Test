- id: ageing_buckets
  question_bank_id: Q029
  persona: Sales / Marketing
  intent: ageing
  join_depth: 3
  tables:
  - trn_bill
  - mst_ledger
  - trn_voucher
  slots: {}
  sql: "SELECT ml.name AS customer,\n  SUM(CASE WHEN CURRENT_DATE - tb.due_date <= 30 THEN ABS(tb.closing_balance) ELSE 0\
    \ END) AS \"0-30_days\",\n  SUM(CASE WHEN CURRENT_DATE - tb.due_date BETWEEN 31 AND 60 THEN ABS(tb.closing_balance) ELSE\
    \ 0 END) AS \"31-60_days\",\n  SUM(CASE WHEN CURRENT_DATE - tb.due_date BETWEEN 61 AND 90 THEN ABS(tb.closing_balance)\
    \ ELSE 0 END) AS \"61-90_days\",\n  SUM(CASE WHEN CURRENT_DATE - tb.due_date > 90 THEN ABS(tb.closing_balance) ELSE 0\
    \ END) AS \"90plus_days\"\nFROM trn_bill tb\nJOIN trn_voucher tv ON tb.guid = tv.guid\nJOIN mst_ledger ml ON tv._party_name\
    \ = ml.guid\nWHERE tb.closing_balance <> 0\n  AND tv.is_invoice = 1\nGROUP BY ml.name\nORDER BY \"90plus_days\" DESC;"
  nl_en: Show receivable ageing in 30/60/90 day buckets by customer.
- id: ageing_summary
  question_bank_id: Q029
  persona: Sales / Marketing
  intent: ageing
  join_depth: 3
  tables:
  - trn_bill
  - mst_ledger
  - trn_voucher
  slots: {}
  sql: "SELECT\n  SUM(CASE WHEN CURRENT_DATE - tb.due_date <= 30 THEN ABS(tb.closing_balance) ELSE 0 END) AS \"0-30\",\n \
    \ SUM(CASE WHEN CURRENT_DATE - tb.due_date BETWEEN 31 AND 60 THEN ABS(tb.closing_balance) ELSE 0 END) AS \"31-60\",\n\
    \  SUM(CASE WHEN CURRENT_DATE - tb.due_date BETWEEN 61 AND 90 THEN ABS(tb.closing_balance) ELSE 0 END) AS \"61-90\",\n\
    \  SUM(CASE WHEN CURRENT_DATE - tb.due_date > 90 THEN ABS(tb.closing_balance) ELSE 0 END) AS \"90+\",\n  SUM(ABS(tb.closing_balance))\
    \ AS total_outstanding\nFROM trn_bill tb\nJOIN trn_voucher tv ON tb.guid = tv.guid\nWHERE tb.closing_balance <> 0 AND\
    \ tv.is_invoice = 1;"
  nl_en: What is the total receivables ageing summary?
- id: ageing_overdue_90plus
