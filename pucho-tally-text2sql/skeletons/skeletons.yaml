    FROM trn_bill tb\nJOIN trn_voucher tv ON tb.guid = tv.guid\nJOIN mst_ledger ml ON tv._party_name = ml.guid\nWHERE ml.name\
    \ ILIKE '%{party}%'\n  AND tb.closing_balance <> 0\nORDER BY tb.due_date;"
