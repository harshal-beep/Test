    \ = ml.guid\nJOIN mst_group mg ON ml._parent = mg.guid\nJOIN trn_voucher tv ON tcc.guid = tv.guid\nWHERE tv.date BETWEEN\
    \ (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period\
    \ To')\nGROUP BY mcc.name\nORDER BY net_pl DESC;"
