  - mst_cost_centre
  - mst_ledger
  - trn_voucher
  slots: {}
  sql: "SELECT mcc.name AS cost_centre,\n  SUM(CASE WHEN mg.name IN ('Sales Accounts','Direct Incomes','Indirect Incomes')\n\
    \           THEN -tcc.amount ELSE 0 END) AS income,\n  SUM(CASE WHEN mg.name IN ('Direct Expenses','Indirect Expenses')\n\
    \           THEN tcc.amount ELSE 0 END) AS expenses,\n  SUM(CASE WHEN mg.name IN ('Sales Accounts','Direct Incomes','Indirect\
    \ Incomes',\n                            'Direct Expenses','Indirect Expenses')\n           THEN -tcc.amount ELSE 0 END)\
