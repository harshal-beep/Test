  - trn_voucher
  slots: {}
  sql: "SELECT ml.name AS customer,\n  tv.voucher_number,\n  tv.date AS invoice_date,\n  tb.due_date,\n  CURRENT_DATE - tb.due_date\
    \ AS days_overdue,\n  ABS(tb.amount) AS bill_amount,\n  ABS(tb.closing_balance) AS outstanding\nFROM trn_bill tb\nJOIN\
    \ trn_voucher tv ON tb.guid = tv.guid\nJOIN mst_ledger ml ON tv._party_name = ml.guid\nWHERE tb.due_date < CURRENT_DATE\n\
    \  AND tb.closing_balance <> 0\nORDER BY days_overdue DESC;"
  nl_en: List overdue invoices with days past due.
- id: daily_collection_total
  question_bank_id: Q010
  persona: Owner / Seth
  intent: daily_collection
  join_depth: 3
  tables:
  - trn_accounting
  - trn_voucher
  - mst_vouchertype
  slots: {}
  sql: "SELECT tv.date AS collection_date,\n  SUM(ta.amount) AS total_collected\nFROM trn_accounting ta\nJOIN trn_voucher\
    \ tv ON ta.guid = tv.guid\nJOIN mst_vouchertype mvt ON tv._voucher_type = mvt.guid\nWHERE mvt.name = 'Receipt'\n  AND\
    \ tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE\
    \ name = 'Period To')\nGROUP BY tv.date\nORDER BY tv.date;"
  nl_en: Show daily collections for this period.
- id: daily_collection_by_party
  question_bank_id: Q010
  persona: Owner / Seth
