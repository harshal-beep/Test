- id: profit_period
  question_bank_id: Q003
  persona: Owner / Seth
  intent: profit
  join_depth: 3
  tables:
  - mst_ledger
  - mst_group
  - trn_accounting
  - trn_voucher
  slots: {}
  sql: "SELECT\n  -SUM(CASE WHEN mg.name IN ('Sales Accounts','Direct Incomes','Indirect Incomes')\n            THEN ta.amount\
    \ ELSE 0 END) AS total_income,\n  SUM(CASE WHEN mg.name IN ('Direct Expenses','Indirect Expenses','Purchase Accounts')\n\
    \           THEN ta.amount ELSE 0 END) AS total_expenses,\n  -SUM(CASE WHEN mg.name IN ('Sales Accounts','Direct Incomes','Indirect\
    \ Incomes',\n                             'Direct Expenses','Indirect Expenses','Purchase Accounts')\n            THEN\
    \ ta.amount ELSE 0 END) AS net_profit\nFROM trn_accounting ta\nJOIN trn_voucher tv ON ta.guid = tv.guid\nJOIN mst_ledger\
    \ ml ON ta._ledger = ml.guid\nJOIN mst_group mg ON ml._parent = mg.guid\nWHERE tv.date BETWEEN (SELECT value::date FROM\
    \ config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\n  AND tv.is_order_voucher\
    \ = 0;"
  nl_en: How much profit did we make this period?
- id: profit_by_month
  question_bank_id: Q003
  persona: Owner / Seth
  intent: profit
  join_depth: 3
  tables:
  - mst_ledger
  - mst_group
  - trn_accounting
  - trn_voucher
  slots: {}
  sql: "SELECT EXTRACT(MONTH FROM tv.date) AS month,\n  -SUM(ta.amount) AS net_profit\nFROM trn_accounting ta\nJOIN trn_voucher\
    \ tv ON ta.guid = tv.guid\nJOIN mst_ledger ml ON ta._ledger = ml.guid\nJOIN mst_group mg ON ml._parent = mg.guid\nWHERE\
    \ mg.name IN ('Sales Accounts','Direct Incomes','Indirect Incomes',\n                  'Direct Expenses','Indirect Expenses','Purchase\
    \ Accounts')\n  AND tv.is_order_voucher = 0\nGROUP BY EXTRACT(MONTH FROM tv.date)\nORDER BY month;"
  nl_en: Show monthly profit for the current year.
