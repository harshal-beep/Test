    \ = tv.guid\nJOIN mst_ledger ml ON ta._ledger = ml.guid\nJOIN mst_group mg ON ml._parent = mg.guid\nWHERE mg.name IN ('Sales\
    \ Accounts','Direct Incomes','Indirect Incomes',\n                  'Direct Expenses','Indirect Expenses','Purchase Accounts')\n\
    \  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config\
    \ WHERE name = 'Period To')\n  AND tv.is_order_voucher = 0\nGROUP BY mg.name\nORDER BY net_amount DESC;"
  nl_en: Break down profit by ledger group for this period.
