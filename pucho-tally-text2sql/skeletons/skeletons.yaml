  intent: cost_centre_compare
  join_depth: 3
  tables:
  - trn_cost_centre
  - mst_cost_centre
  - trn_voucher
  slots: {}
  sql: "SELECT mcc.name AS cost_centre,\n  EXTRACT(MONTH FROM tv.date) AS month,\n  SUM(tcc.amount) AS spend\nFROM trn_cost_centre\
    \ tcc\nJOIN mst_cost_centre mcc ON tcc._costcentre = mcc.guid\nJOIN trn_voucher tv ON tcc.guid = tv.guid\nWHERE tv.date\
    \ BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name =\
    \ 'Period To')\nGROUP BY mcc.name, EXTRACT(MONTH FROM tv.date)\nORDER BY mcc.name, month;"
  nl_en: Show monthly cost centre spend comparison.
