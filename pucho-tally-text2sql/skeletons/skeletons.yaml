    \ config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY msi.tax_rate\n\
    ORDER BY msi.tax_rate;"
  nl_en: Show sales broken down by GST rate slab.
- id: sales_by_gst_rate_item
  question_bank_id: Q014
  persona: Accountant / Munim
  intent: sales_by_gst_rate
  join_depth: 3
  tables:
  - mst_stock_item
  - trn_inventory
  - trn_voucher
  slots: {}
  sql: "SELECT msi.name AS item_name, msi.tax_rate AS gst_pct,\n  -SUM(ti.amount) AS sales_value\nFROM trn_inventory ti\n\
    JOIN mst_stock_item msi ON ti._item = msi.guid\nJOIN trn_voucher tv ON ti.guid = tv.guid\nWHERE tv.is_invoice = 1 AND\
