    \ msi ON tcicc._item = msi.guid\nJOIN mst_cost_centre mcc ON tcicc._costcentre = mcc.guid\nJOIN trn_voucher tv ON tcicc.guid\
    \ = tv.guid\nWHERE mcc.name ILIKE '%{cost_centre}%'\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name\
    \ = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY msi.name\nORDER BY total_cost\
    \ DESC;"
  nl_en: Show item costs for cost centre {cost_centre}.
- id: gross_margin_period
  question_bank_id: Q070
  persona: Owner / Seth
  intent: gross_margin
  join_depth: 3
  tables:
  - trn_accounting
  - trn_voucher
  - mst_ledger
  - mst_group
  slots: {}
  sql: "SELECT\n  -SUM(CASE WHEN mg.name = 'Sales Accounts' THEN ta.amount ELSE 0 END) AS sales,\n  SUM(CASE WHEN mg.name\
    \ IN ('Direct Expenses','Purchase Accounts') THEN ta.amount ELSE 0 END) AS cogs,\n  -SUM(CASE WHEN mg.name = 'Sales Accounts'\
    \ THEN ta.amount ELSE 0 END)\n  - SUM(CASE WHEN mg.name IN ('Direct Expenses','Purchase Accounts') THEN ta.amount ELSE\
    \ 0 END)\n    AS gross_profit,\n  ROUND(\n    (-SUM(CASE WHEN mg.name = 'Sales Accounts' THEN ta.amount ELSE 0 END)\n\
    \     - SUM(CASE WHEN mg.name IN ('Direct Expenses','Purchase Accounts') THEN ta.amount ELSE 0 END))\n    / NULLIF(-SUM(CASE\
    \ WHEN mg.name = 'Sales Accounts' THEN ta.amount ELSE 0 END), 0) * 100,\n    2\n  ) AS gross_margin_pct\nFROM trn_accounting\
    \ ta\nJOIN trn_voucher tv ON ta.guid = tv.guid\nJOIN mst_ledger ml ON ta._ledger = ml.guid\nJOIN mst_group mg ON ml._parent\
    \ = mg.guid\nWHERE tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date\
    \ FROM config WHERE name = 'Period To')\n  AND tv.is_order_voucher = 0;"
  nl_en: What is my gross margin percentage this period?
- id: gross_margin_by_month
  question_bank_id: Q070
  persona: Owner / Seth
  intent: gross_margin
  join_depth: 3
  tables:
  - trn_accounting
  - trn_voucher
  - mst_ledger
  - mst_group
  slots: {}
  sql: "SELECT EXTRACT(MONTH FROM tv.date) AS month,\n  -SUM(CASE WHEN mg.name = 'Sales Accounts' THEN ta.amount ELSE 0 END)\
    \ AS sales,\n  SUM(CASE WHEN mg.name IN ('Direct Expenses','Purchase Accounts') THEN ta.amount ELSE 0 END) AS cogs,\n\
    \  -SUM(CASE WHEN mg.name IN ('Sales Accounts','Direct Expenses','Purchase Accounts')\n            THEN ta.amount ELSE\
    \ 0 END) AS gross_profit\nFROM trn_accounting ta\nJOIN trn_voucher tv ON ta.guid = tv.guid\nJOIN mst_ledger ml ON ta._ledger\
    \ = ml.guid\nJOIN mst_group mg ON ml._parent = mg.guid\nWHERE tv.date BETWEEN (SELECT value::date FROM config WHERE name\
    \ = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY EXTRACT(MONTH FROM tv.date)\n\
    ORDER BY month;"
  nl_en: Show monthly gross margin trend.
- id: current_ratio
  question_bank_id: Q071
  persona: Owner / Seth
  intent: current_ratio
  join_depth: 2
  tables:
  - mst_ledger
  - mst_group
  slots: {}
  sql: "SELECT\n  SUM(CASE WHEN mg.name IN ('Sundry Debtors','Cash-in-Hand','Bank Accounts','Stock-in-Hand')\n           THEN\
    \ ABS(ml.closing_balance) ELSE 0 END) AS current_assets,\n  SUM(CASE WHEN mg.name IN ('Sundry Creditors','Bank OD Accounts')\n\
    \           THEN ABS(ml.closing_balance) ELSE 0 END) AS current_liabilities,\n  ROUND(\n    SUM(CASE WHEN mg.name IN ('Sundry\
    \ Debtors','Cash-in-Hand','Bank Accounts','Stock-in-Hand')\n             THEN ABS(ml.closing_balance) ELSE 0 END)\n  \
    \  / NULLIF(SUM(CASE WHEN mg.name IN ('Sundry Creditors','Bank OD Accounts')\n                      THEN ABS(ml.closing_balance)\
    \ ELSE 0 END), 0),\n    2\n  ) AS current_ratio\nFROM mst_ledger ml\nJOIN mst_group mg ON ml._parent = mg.guid;"
  nl_en: What is my current ratio (current assets / current liabilities)?
- id: expense_ratio
  question_bank_id: Q072
  persona: Owner / Seth
  intent: expense_ratio
  join_depth: 3
  tables:
  - trn_accounting
  - trn_voucher
  - mst_ledger
  - mst_group
  slots: {}
  sql: "SELECT\n  -SUM(CASE WHEN mg.name = 'Sales Accounts' THEN ta.amount ELSE 0 END) AS total_sales,\n  SUM(CASE WHEN mg.name\
    \ IN ('Indirect Expenses') THEN ta.amount ELSE 0 END) AS indirect_expenses,\n  ROUND(\n    SUM(CASE WHEN mg.name IN ('Indirect\
    \ Expenses') THEN ta.amount ELSE 0 END)\n    / NULLIF(-SUM(CASE WHEN mg.name = 'Sales Accounts' THEN ta.amount ELSE 0\
    \ END), 0) * 100,\n    2\n  ) AS expense_ratio_pct\nFROM trn_accounting ta\nJOIN trn_voucher tv ON ta.guid = tv.guid\n\
    JOIN mst_ledger ml ON ta._ledger = ml.guid\nJOIN mst_group mg ON ml._parent = mg.guid\nWHERE tv.date BETWEEN (SELECT value::date\
    \ FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\n  AND tv.is_order_voucher\
    \ = 0;"
  nl_en: What is my operating expense ratio (expenses as % of sales)?
- id: top_expense_growth
  question_bank_id: Q073
  persona: Owner / Seth
  intent: top_expense_growth
  join_depth: 3
  tables:
  - trn_accounting
  - trn_voucher
  - mst_ledger
  - mst_group
  slots: {}
  sql: "WITH yearly AS (\n  SELECT ml.name AS ledger,\n    SUM(CASE WHEN EXTRACT(YEAR FROM tv.date) = EXTRACT(YEAR FROM CURRENT_DATE)\n\
    \             THEN ta.amount ELSE 0 END) AS this_year,\n    SUM(CASE WHEN EXTRACT(YEAR FROM tv.date) = EXTRACT(YEAR FROM\
    \ CURRENT_DATE) - 1\n             THEN ta.amount ELSE 0 END) AS last_year\n  FROM trn_accounting ta\n  JOIN trn_voucher\
    \ tv ON ta.guid = tv.guid\n  JOIN mst_ledger ml ON ta._ledger = ml.guid\n  JOIN mst_group mg ON ml._parent = mg.guid\n\
    \  WHERE mg.name IN ('Direct Expenses','Indirect Expenses')\n  GROUP BY ml.name\n)\nSELECT ledger, this_year, last_year,\n\
    \  this_year - last_year AS growth,\n  ROUND((this_year - last_year) / NULLIF(last_year, 0) * 100, 2) AS growth_pct\n\
    FROM yearly\nWHERE last_year > 0\nORDER BY growth DESC\nLIMIT 10;"
  nl_en: Which expense heads grew the most compared to last year?
