  join_depth: 3
  tables:
  - trn_accounting
  - trn_voucher
  - mst_vouchertype
  slots: {}
  sql: "SELECT tv.date, tv.party_name,\n  SUM(ta.amount) AS amount_collected\nFROM trn_voucher tv\nJOIN trn_accounting ta\
    \ ON ta.guid = tv.guid\nJOIN mst_vouchertype mvt ON tv._voucher_type = mvt.guid\nWHERE mvt.name = 'Receipt'\n  AND tv.date\
    \ BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name =\
    \ 'Period To')\n  AND ta.ledger = tv.party_name\nGROUP BY tv.date, tv.party_name\nORDER BY tv.date, amount_collected DESC;"
  nl_en: Show daily collections by customer.
- id: gst_output_tax_total
  question_bank_id: Q011
  persona: Accountant / Munim
  intent: gst_output_tax
  join_depth: 3
  tables:
  - mst_ledger
  - mst_group
  - trn_accounting
  - trn_voucher
  slots: {}
  sql: "SELECT ml.name AS gst_ledger,\n  SUM(ta.amount) AS gst_collected\nFROM mst_ledger ml\nJOIN mst_group mg ON ml._parent\
    \ = mg.guid\nJOIN trn_accounting ta ON ta._ledger = ml.guid\nJOIN trn_voucher tv ON ta.guid = tv.guid\nWHERE mg.name =\
    \ 'Duties & Taxes'\n  AND ml.name ILIKE '%CGST%' OR ml.name ILIKE '%SGST%' OR ml.name ILIKE '%IGST%'\n  AND tv.is_invoice\
    \ = 1\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From') AND (SELECT value::date FROM\
    \ config WHERE name = 'Period To')\nGROUP BY ml.name\nORDER BY gst_collected DESC;"
  nl_en: What is my total GST output tax collected this period?
- id: gst_output_tax_by_rate
  question_bank_id: Q011
  persona: Accountant / Munim
  intent: gst_output_tax
  join_depth: 3
  tables:
  - mst_stock_item
  - trn_inventory
  - trn_voucher
  slots: {}
  sql: "SELECT msi.tax_rate,\n  SUM(ABS(ti.quantity)) AS qty_sold,\n  -SUM(ti.amount) AS taxable_value,\n  (-SUM(ti.amount))\
    \ * msi.tax_rate / 100 AS estimated_gst\nFROM trn_inventory ti\nJOIN mst_stock_item msi ON ti._item = msi.guid\nJOIN trn_voucher\
    \ tv ON ti.guid = tv.guid\nWHERE tv.is_invoice = 1\n  AND ti.quantity < 0\n  AND tv.date BETWEEN (SELECT value::date FROM\
    \ config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY msi.tax_rate\n\
    ORDER BY msi.tax_rate;"
  nl_en: Show GST output tax breakdown by tax rate.
- id: gst_input_tax_total
  question_bank_id: Q012
  persona: Accountant / Munim
  intent: gst_input_tax
  join_depth: 3
  tables:
  - mst_ledger
  - mst_group
  - trn_accounting
  - trn_voucher
  slots: {}
  sql: "SELECT ml.name AS gst_ledger,\n  SUM(ta.amount) AS gst_paid\nFROM mst_ledger ml\nJOIN mst_group mg ON ml._parent =\
    \ mg.guid\nJOIN trn_accounting ta ON ta._ledger = ml.guid\nJOIN trn_voucher tv ON ta.guid = tv.guid\nWHERE mg.name = 'Duties\
    \ & Taxes'\n  AND (ml.name ILIKE '%input%' OR ml.name ILIKE '%purchase%')\n  AND tv.date BETWEEN (SELECT value::date FROM\
    \ config WHERE name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY ml.name\n\
    ORDER BY gst_paid DESC;"
  nl_en: What is my total GST input tax paid on purchases?
- id: gst_input_tax_by_supplier
  question_bank_id: Q012
  persona: Accountant / Munim
  intent: gst_input_tax
  join_depth: 3
  tables:
  - mst_ledger
  - mst_group
  - trn_accounting
  - trn_voucher
  slots: {}
  sql: "SELECT tv.party_name AS supplier,\n  SUM(CASE WHEN ml.name ILIKE '%CGST%' OR ml.name ILIKE '%SGST%' OR ml.name ILIKE\
    \ '%IGST%'\n           THEN ta.amount ELSE 0 END) AS total_gst_input\nFROM trn_voucher tv\nJOIN trn_accounting ta ON ta.guid\
    \ = tv.guid\nJOIN mst_ledger ml ON ta._ledger = ml.guid\nJOIN mst_group mg ON ml._parent = mg.guid\nWHERE mg.name = 'Duties\
    \ & Taxes'\n  AND tv.is_invoice = 1\n  AND tv.date BETWEEN (SELECT value::date FROM config WHERE name = 'Period From')\
    \ AND (SELECT value::date FROM config WHERE name = 'Period To')\nGROUP BY tv.party_name\nORDER BY total_gst_input DESC;"
  nl_en: Show GST input tax by supplier for this period.
- id: gst_net_payable
  question_bank_id: Q013
  persona: Accountant / Munim
  intent: gst_net_payable
  join_depth: 3
  tables:
  - mst_ledger
  - mst_group
  - trn_accounting
  - trn_voucher
  slots: {}
  sql: "WITH gst_summary AS (\n  SELECT\n    SUM(CASE WHEN ml.name ILIKE '%output%' OR (mg.name = 'Duties & Taxes' AND ta.amount\
    \ > 0)\n             THEN ta.amount ELSE 0 END) AS output_tax,\n    SUM(CASE WHEN ml.name ILIKE '%input%' OR (mg.name\
    \ = 'Duties & Taxes' AND ta.amount < 0)\n             THEN ABS(ta.amount) ELSE 0 END) AS input_credit\n  FROM trn_accounting\
    \ ta\n  JOIN trn_voucher tv ON ta.guid = tv.guid\n  JOIN mst_ledger ml ON ta._ledger = ml.guid\n  JOIN mst_group mg ON\
    \ ml._parent = mg.guid\n  WHERE mg.name = 'Duties & Taxes'\n    AND tv.date BETWEEN (SELECT value::date FROM config WHERE\
    \ name = 'Period From') AND (SELECT value::date FROM config WHERE name = 'Period To')\n)\nSELECT output_tax, input_credit,\n\
    \  output_tax - input_credit AS net_gst_payable\nFROM gst_summary;"
  nl_en: What is my net GST payable (output minus input credit) this period?
- id: gst_net_payable_monthly
  question_bank_id: Q013
  persona: Accountant / Munim
  intent: gst_net_payable
  join_depth: 3
  tables:
  - mst_ledger
  - mst_group
  - trn_accounting
  - trn_voucher
  slots: {}
  sql: "SELECT EXTRACT(MONTH FROM tv.date) AS month,\n  SUM(CASE WHEN ta.amount > 0 THEN ta.amount ELSE 0 END) AS output_tax,\n\
    \  SUM(CASE WHEN ta.amount < 0 THEN ABS(ta.amount) ELSE 0 END) AS input_credit,\n  SUM(ta.amount) AS net_payable\nFROM\
    \ trn_accounting ta\nJOIN trn_voucher tv ON ta.guid = tv.guid\nJOIN mst_ledger ml ON ta._ledger = ml.guid\nJOIN mst_group\
    \ mg ON ml._parent = mg.guid\nWHERE mg.name = 'Duties & Taxes'\nGROUP BY EXTRACT(MONTH FROM tv.date)\nORDER BY month;"
  nl_en: Show monthly GST net payable.
- id: sales_by_gst_rate
  question_bank_id: Q014
  persona: Accountant / Munim
  intent: sales_by_gst_rate
  join_depth: 3
  tables:
  - mst_stock_item
  - trn_inventory
  - trn_voucher
  slots: {}
  sql: "SELECT msi.tax_rate AS gst_rate_pct,\n  COUNT(DISTINCT tv.guid) AS invoice_count,\n  SUM(ABS(ti.quantity)) AS total_qty,\n\
