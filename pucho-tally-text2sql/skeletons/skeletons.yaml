- id: overdue_customers_list
  question_bank_id: Q009
  persona: Owner / Seth
  intent: overdue_customers
  join_depth: 3
  tables:
  - trn_bill
  - mst_ledger
  - trn_voucher
  slots: {}
  sql: "SELECT ml.name AS customer,\n  COUNT(tb.guid) AS pending_bills,\n  SUM(ABS(tb.amount)) AS total_overdue\nFROM trn_bill\
    \ tb\nJOIN trn_voucher tv ON tb.guid = tv.guid\nJOIN mst_ledger ml ON tv._party_name = ml.guid\nWHERE tb.due_date < CURRENT_DATE\n\
    \  AND tb.closing_balance <> 0\n  AND tv.is_invoice = 1\nGROUP BY ml.name\nORDER BY total_overdue DESC;"
  nl_en: Which customers have overdue payments?
- id: overdue_customers_days
  question_bank_id: Q009
  persona: Owner / Seth
  intent: overdue_customers
  join_depth: 3
  tables:
  - trn_bill
